<!DOCTYPE html>

    <style>
* {
    box-sizing: border‑box;
    margin: 0;
    padding: 0;
}
body {
    font‑family: Georgia, "Times New Roman", serif;
    color: #222;
    line‑height: 1.75;
    max‑width: 1100px;
    margin: 0 auto;
    padding: 0 28px 40px;
    background‑color: #ffffff;
}
#nav {
    display: flex;
    align‑items: center;
    justify‑content: space‑between;
    max‑width: 1100px;
    margin: 0 auto 38px;
    padding: 18px 0;
    border‑bottom: 1px solid #e5e7eb;
}
.logo img {
    height: 32px;
    width: auto;
    display: block;
}
.menu {
    display: flex;
    gap: 30px;
    flex‑wrap: wrap;
}
.menu a {
    text‑decoration: none;
    color: #333;
    font‑size: 17px;
    padding: 8px 6px;
    transition: all 0.2s ease;
}
.menu a:hover {
    color: #1a4480;
}
.menu a.active {
    color: #1a4480;
    font‑weight: 500;
    border‑bottom: 2px solid #1a4480;
}
h1 {
    font‑size: 32px;
    color: #111827;
    font‑weight: normal;
    margin‑bottom: 20px;
}
h2 {
    font‑size: 24px;
    color: #222;
    font‑weight: normal;
    margin: 36px 0 16px;
}
.news‑item {
    margin‑bottom: 26px;
}
.news‑date {
    color: #555;
    font‑size: 16px;
    margin‑bottom: 6px;
}
p {
    font‑size: 17px;
    color: #333;
    margin‑bottom: 16px;
}
a {
    color: #1a4480;
    text‑decoration: none;
}
a:hover {
    text‑decoration: underline;
}
#footer {
    margin‑top: 60px;
    text‑align: center;
    font‑size: 15px;
    color: #666;
    border‑top: 1px solid #e5e7eb;
    padding‑top: 20px;
}
@media (max‑width: 768px) {
    #nav {
        flex‑direction: column;
        gap: 18px;
        text‑align: center;
    }
    .menu {
        justify‑content: center;
        gap: 20px;
    }
    h1 { font‑size: 28px; }
    h2 { font‑size: 21px; }
    p { font‑size: 16px; }
    body { padding: 0 20px; }
}
    </style>
</head>
